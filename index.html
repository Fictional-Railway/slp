<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock & Weather</title>
    <style>
        :root {
            --bg-color: #000;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-glow: rgba(56, 189, 248, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; /* テキスト選択を防止 */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: background-color 0.5s ease;
        }

        /* メインコンテンツ配置 */
        .container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        /* 大きな時刻表示 */
        .time {
            font-size: clamp(4rem, 15vw, 10rem);
            font-weight: 200;
            letter-spacing: -2px;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 30px var(--accent-glow);
        }

        /* 日付と天気のエリア */
        .sub-info {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            font-size: clamp(1rem, 3vw, 1.5rem);
            color: var(--text-sub);
            font-weight: 300;
        }

        /* おやすみボタン */
        .sleep-btn {
            margin-top: 2rem;
            padding: 0.8rem 1.8rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-sub);
            font-size: 0.9rem;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            outline: none;
        }

        .sleep-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: var(--text-main);
            transform: translateY(-2px);
        }

        /* おやすみモード（真っ黒画面）の設定 */
        body.sleep-mode {
            background-color: #000000;
            cursor: pointer;
        }

        body.sleep-mode .container {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none; /* ボタン等の判定を無効化 */
        }
    </style>
</head>
<body>

    <div class="container" id="container">
        <!-- 時刻 -->
        <div class="time" id="clock">00:00:00</div>
        
        <!-- 日付 -->
        <div class="sub-info">
            <div id="date">----年--月--日 (--)</div>
        </div>

    </div>

    <script>
        // --- 1. 時計機能 ---
        function updateClock() {
            const now = new Date();
            
            // 時刻の更新 (HH:MM:SS)
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;

            // 日付の更新
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const dayNames = ['日', '月', '火', '水', '木', '金', '土'];
            const day = dayNames[now.getDay()];
            document.getElementById('date').textContent = `${year}年${month}月${date}日 (${day})`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- 2. おやすみモード機能 ---
        const sleepBtn = document.getElementById('sleepBtn');
        const body = document.body;

        // おやすみボタンを押したとき
        sleepBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // イベントのバブリングを停止
            body.classList.add('sleep-mode');
        });

        // 画面のどこかをタップ/クリックしたとき（戻る処理）
        window.addEventListener('click', () => {
            if (body.classList.contains('sleep-mode')) {
                body.classList.remove('sleep-mode');
            }
        });
    </script>
</body>
</html>
