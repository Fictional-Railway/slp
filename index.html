<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock & Weather</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-glow: rgba(56, 189, 248, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; /* テキスト選択を防止 */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: background-color 0.5s ease;
        }

        /* メインコンテンツ配置 */
        .container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        /* 大きな時刻表示 */
        .time {
            font-size: clamp(4rem, 15vw, 10rem);
            font-weight: 200;
            letter-spacing: -2px;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 30px var(--accent-glow);
        }

        /* 日付と天気のエリア */
        .sub-info {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            font-size: clamp(1rem, 3vw, 1.5rem);
            color: var(--text-sub);
            font-weight: 300;
        }

        .weather-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            min-height: 2em;
        }

        .weather-icon {
            font-size: 1.2em;
        }

        /* おやすみボタン */
        .sleep-btn {
            margin-top: 2rem;
            padding: 0.8rem 1.8rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-sub);
            font-size: 0.9rem;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            outline: none;
        }

        .sleep-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: var(--text-main);
            transform: translateY(-2px);
        }

        /* おやすみモード（真っ黒画面）の設定 */
        body.sleep-mode {
            background-color: #000000;
            cursor: pointer;
        }

        body.sleep-mode .container {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none; /* ボタン等の判定を無効化 */
        }
    </style>
</head>
<body>

    <div class="container" id="container">
        <!-- 時刻 -->
        <div class="time" id="clock">00:00:00</div>
        
        <!-- 日付 & 天気 -->
        <div class="sub-info">
            <div id="date">----年--月--日 (--)</div>
            <div class="weather-box" id="weather">天気情報を取得中...</div>
        </div>

        <!-- おやすみボタン -->
        <button class="sleep-btn" id="sleepBtn">🌙 おやすみモード</button>
    </div>

    <script>
        // --- 1. 時計機能 ---
        function updateClock() {
            const now = new Date();
            
            // 時刻の更新 (HH:MM:SS)
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;

            // 日付の更新
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const dayNames = ['日', '月', '火', '水', '木', '金', '土'];
            const day = dayNames[now.getDay()];
            document.getElementById('date').textContent = `${year}年${month}月${date}日 (${day})`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- 2. 天気予報API (Open-Meteo & 位置情報API) ---
        // WMO天候コードを日本語表記と絵文字に変換
        function getWeatherDetails(code) {
            const mapping = {
                0: { text: "快晴", icon: "☀️" },
                1: { text: "晴れ", icon: "🌤️" },
                2: { text: "一部曇り", icon: "⛅" },
                3: { text: "くもり", icon: "☁️" },
                45: { text: "霧", icon: "🌫️" },
                51: { text: "霧雨", icon: "🌧️" },
                61: { text: "雨", icon: "☔" },
                71: { text: "雪", icon: "❄️" },
                95: { text: "雷雨", icon: "🌩️" }
            };
            return mapping[code] || { text: "雨/くもり", icon: "🌧️" };
        }

        async function fetchWeather() {
            const weatherEl = document.getElementById('weather');
            try {
                // ① IPアドレスから自動で現在地を取得（権限ポップアップ不要のAPIを使用）
                const geoRes = await fetch('https://ipapi.co/json/');
                const geoData = await geoRes.json();
                const lat = geoData.latitude || 35.6762; // 取得失敗時は東京
                const lon = geoData.longitude || 139.6503;
                const city = geoData.city || "現在地";

                // ② 無料のOpen-Meteo APIから天気と気温を取得（APIキー不要）
                const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&timezone=auto`);
                const weatherData = await weatherRes.json();
                
                const current = weatherData.current_weather;
                const weatherInfo = getWeatherDetails(current.weathercode);
                const temp = Math.round(current.temperature);

                // 画面に反映
                weatherEl.innerHTML = `
                    <span>${city}:</span>
                    <span class="weather-icon">${weatherInfo.icon}</span>
                    <span>${weatherInfo.text}</span>
                    <span>${temp}°C</span>
                `;
            } catch (error) {
                console.error("天気データの取得に失敗しました:", error);
                weatherEl.textContent = "天気を取得できませんでした";
            }
        }
        fetchWeather();
        // 1時間に1回天気を更新
        setInterval(fetchWeather, 3600000);

        // --- 3. おやすみモード機能 ---
        const sleepBtn = document.getElementById('sleepBtn');
        const body = document.body;

        // おやすみボタンを押したとき
        sleepBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // イベントのバブリングを停止
            body.classList.add('sleep-mode');
        });

        // 画面のどこかをタップ/クリックしたとき（戻る処理）
        window.addEventListener('click', () => {
            if (body.classList.contains('sleep-mode')) {
                body.classList.remove('sleep-mode');
            }
        });
    </script>
</body>
</html>
